services:
  web:
    build: .
    image: fitopia-api:latest
    container_name: fitopia-web
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DJANGO_DEBUG: "${DJANGO_DEBUG:-false}"
      DJANGO_SECRET_KEY: "${DJANGO_SECRET_KEY:?set DJANGO_SECRET_KEY in .env}"
      DJANGO_ALLOWED_HOSTS: "${DJANGO_ALLOWED_HOSTS:-*}"
      DJANGO_TIME_ZONE: "${DJANGO_TIME_ZONE:-Asia/Tehran}"
      REDIS_URL: "${REDIS_URL:-redis://redis:6379/0}"
      REDIS_OPTIONAL: "${REDIS_OPTIONAL:-true}"
      CSRF_TRUSTED_ORIGINS: "${CSRF_TRUSTED_ORIGINS:-}"
      SQLITE_PATH: "/app/data/db.sqlite3"
    volumes:
      - fitopia_data:/app/data
      - fitopia_media:/app/media
      - fitopia_static:/app/staticfiles
    depends_on:
      redis:
        condition: service_started
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/api/schema/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  redis:
    image: redis:7-alpine
    container_name: fitopia-redis
    restart: unless-stopped
    volumes:
      - fitopia_redis:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:1.27-alpine
    container_name: fitopia-nginx
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - fitopia_media:/app/media:ro
      - fitopia_static:/app/staticfiles:ro
    depends_on:
      web:
        condition: service_healthy

volumes:
  fitopia_data:
  fitopia_media:
  fitopia_static:
  fitopia_redis:
